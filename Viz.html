<!-- Viz.html — 管理画面と進捗ページで共有するグラフ部品。
     host 側で $(id) を定義しておくこと。 -->
<style>
  /* --- グラフ --- */
  .vizscope{--surface-1:#fff;--grid:#e8eaed;--ink-2:#5f6368;--ink-3:#80868b;
       --line:#2a78d6;--c0:#f0efec;--c1:#b7d3f6;--c2:#5598e7;--c3:#1c5cab}
  .viz{position:relative}
  .viz svg{display:block;width:100%;height:auto;overflow:visible}
  /* カバレッジは引き伸ばさない（文字まで拡大されるため）。狭い画面では横スクロール。 */
  .viz.fixed{overflow-x:auto}
  .viz.fixed svg{width:auto;max-width:none}
  .viz .ax{font-size:10px;fill:var(--ink-3)}
  .viz .gl{stroke:var(--grid);stroke-width:1}
  .viz .ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .viz .dot{fill:var(--line);stroke:var(--surface-1);stroke-width:2}
  .viz .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
  .chartHead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px}
  .chartHead .t{font-size:.82rem;font-weight:600;color:#3c4043}
  .chartHead .v{font-size:.78rem;color:#5f6368}
  .tip{position:absolute;pointer-events:none;background:#202124;color:#fff;font-size:.74rem;
       padding:5px 8px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:#5f6368;margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
            vertical-align:-1px}
  .viznote{font-size:.76rem;color:#5f6368;margin:6px 0 0}
  /* ページ本体がライト固定なので、グラフだけ OS のダークモードに追従させない。
     追従させると「記録なし」が黒、「3種そろい」が淡色になり、白い背景の上で逆に見える。 */
</style>

<script>

// ---- グラフ ---------------------------------------------------------------
// 外部ライブラリを使わず SVG を直接組む。CDN が塞がれている環境でも動くこと、
// 読み込み待ちでグラフだけ遅れて出る状態を作らないことを優先した。

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(n, a) {
  var e = document.createElementNS(SVGNS, n);
  for (var k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
  return e;
}
function mdLabel(iso) { return iso.substring(5).replace('-', '/'); }
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return v >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v * 10) / 10);
}

function tipFor(box) {
  var t = document.createElement('div');
  t.className = 'tip';
  box.appendChild(t);
  return {
    show: function (x, y, html) {
      t.innerHTML = html; t.style.opacity = 1;
      var w = t.offsetWidth, bw = box.clientWidth;
      t.style.left = Math.max(0, Math.min(bw - w, x - w / 2)) + 'px';
      t.style.top  = Math.max(0, y - t.offsetHeight - 8) + 'px';
    },
    hide: function () { t.style.opacity = 0; }
  };
}

/** 収集カバレッジ（被験者 × 日）。 */
function drawCoverage(box, d) {
  box.innerHTML = '';
  if (!d.ids.length) { box.innerHTML = '<p class="sub">連携済みの被験者がいません。</p>'; return; }

  var LW = 160, GAP = 2, TOP = 16;
  // 日数が少ないときはマスを大きくして、下の折れ線と横幅を揃える
  var CELL = Math.max(10, Math.min(22, Math.round((780 - LW) / d.axis.length)));
  var W = LW + d.axis.length * CELL, H = TOP + d.ids.length * CELL + 4;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
                           'aria-label': '被験者ごと・日ごとの収集状況' });
  var tip = tipFor(box);

  // 日付の目盛り（週の頭だけ）
  d.axis.forEach(function (iso, j) {
    if (new Date(iso + 'T00:00:00').getDay() !== 1) return;
    var t = svgEl('text', { x: LW + j * CELL, y: 10, class: 'ax' });
    t.textContent = mdLabel(iso);
    svg.appendChild(t);
  });

  d.ids.forEach(function (id, i) {
    var y = TOP + i * CELL;
    var lab = svgEl('text', { x: 0, y: y + CELL - GAP - 2, class: 'ax' });
    lab.textContent = id.length > 25 ? '…' + id.slice(-24) : id;
    svg.appendChild(lab);

    d.grid[i].forEach(function (n, j) {
      var r = svgEl('rect', {
        x: LW + j * CELL, y: y, width: CELL - GAP, height: CELL - GAP, rx: 2,
        fill: 'var(--c' + n + ')'
      });
      r.addEventListener('mouseenter', function () {
        var p = r.getBoundingClientRect(), b = box.getBoundingClientRect();
        tip.show(p.left - b.left + p.width / 2, p.top - b.top,
                 id + '<br>' + d.axis[j] + ' ・ ' + n + '/3 種');
      });
      r.addEventListener('mouseleave', tip.hide);
      svg.appendChild(r);
    });
  });
  box.appendChild(svg);
}

/** 1指標の折れ線。欠測はつながず切る（補間すると欠測が見えなくなるため）。 */
function drawLine(host, sr, axis, opts) {
  opts = opts || {};
  var card = document.createElement('div');
  if (!opts.bare) {
    card.style.marginTop = '20px';
    var head = document.createElement('div');
    head.className = 'chartHead';
    var last = null;
    for (var k = sr.values.length - 1; k >= 0; k--) if (sr.values[k] !== null) { last = sr.values[k]; break; }
    head.innerHTML = '<span class="t">' + sr.label + '</span>' +
                     '<span class="v">直近 ' + fmtNum(last) + ' ' + sr.unit + '</span>';
    card.appendChild(head);
  }

  var box;
  if (opts.bare) { host.innerHTML = ''; box = host; }
  else { box = document.createElement('div'); box.className = 'viz'; card.appendChild(box); host.appendChild(card); }

  var W = 720, H = 150, L = 44, R = 6, T = 10, B = 20;
  var iw = W - L - R, ih = H - T - B;
  var vals = sr.values.filter(function (v) { return v !== null; });
  if (!vals.length) { box.innerHTML = '<p class="sub">この期間のデータがありません。</p>'; return; }

  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  var pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  if (sr.key === 'steps' && mn < 0) mn = 0;
  // 率は 0〜100 で固定。軸が 102.8 まで伸びると「100%超」があるように見える。
  if (sr.key === 'rate') { mn = 0; mx = 100; }
  // 累計は 0 始まりにしないが、負にはしない。負の累計は存在しない。
  if (sr.key === 'cum' && mn < 0) mn = 0;

  var X = function (i) { return L + (axis.length === 1 ? iw / 2 : i * iw / (axis.length - 1)); };
  var Y = function (v) { return T + ih - (v - mn) / (mx - mn) * ih; };

  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                           'aria-label': sr.label + 'の推移' });
  var tip = tipFor(box);

  [0, 0.5, 1].forEach(function (f) {
    var v = mn + (mx - mn) * f, y = Y(v);
    svg.appendChild(svgEl('line', { x1: L, y1: y, x2: W - R, y2: y, class: 'gl' }));
    var t = svgEl('text', { x: L - 6, y: y + 3, class: 'ax', 'text-anchor': 'end' });
    t.textContent = fmtNum(v);
    svg.appendChild(t);
  });

  var step = Math.max(1, Math.ceil(axis.length / 7));
  axis.forEach(function (iso, i) {
    if (i % step) return;
    var t = svgEl('text', { x: X(i), y: H - 4, class: 'ax', 'text-anchor': 'middle' });
    t.textContent = mdLabel(iso);
    svg.appendChild(t);
  });

  var dstr = '', pen = false;
  sr.values.forEach(function (v, i) {
    if (v === null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true;
  });
  svg.appendChild(svgEl('path', { d: dstr, class: 'ln' }));

  // 前後が欠測の孤立点は線にならないので点を打つ
  sr.values.forEach(function (v, i) {
    if (v === null) return;
    var pre = i > 0 && sr.values[i - 1] !== null, nx = i < sr.values.length - 1 && sr.values[i + 1] !== null;
    if (!pre && !nx) svg.appendChild(svgEl('circle', { cx: X(i), cy: Y(v), r: 3, class: 'dot' }));
  });

  var cross = svgEl('line', { y1: T, y2: T + ih, class: 'cross', opacity: 0 });
  var hd = svgEl('circle', { r: 4.5, class: 'dot', opacity: 0 });
  svg.appendChild(cross); svg.appendChild(hd);

  var hit = svgEl('rect', { x: L, y: T, width: iw, height: ih, fill: 'transparent' });
  hit.addEventListener('mousemove', function (ev) {
    var b = svg.getBoundingClientRect();
    var rel = (ev.clientX - b.left) / b.width * W;
    var i = Math.round((rel - L) / (iw || 1) * (axis.length - 1));
    i = Math.max(0, Math.min(axis.length - 1, i));
    var v = sr.values[i], px = X(i) / W * b.width, bb = box.getBoundingClientRect();
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
    if (v === null) { hd.setAttribute('opacity', 0); }
    else { hd.setAttribute('cx', X(i)); hd.setAttribute('cy', Y(v)); hd.setAttribute('opacity', 1); }
    tip.show(px, (b.top - bb.top) + (v === null ? T : Y(v)) / H * b.height,
             axis[i] + '<br>' + (v === null ? '記録なし' : fmtNum(v) + ' ' + sr.unit));
  });
  hit.addEventListener('mouseleave', function () {
    cross.setAttribute('opacity', 0); hd.setAttribute('opacity', 0); tip.hide();
  });
  svg.appendChild(hit);
  box.appendChild(svg);
}

</script>
