<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       margin:0;padding:24px 16px 64px;background:#f6f8fa;color:#202124;line-height:1.7}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 4px}
  .sub{color:#5f6368;font-size:.85rem;margin:0 0 20px}
  .card{background:#fff;border:1px solid #e0e3e7;border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{font-size:.95rem;margin:0 0 14px;color:#3c4043}
  .stats{display:flex;flex-wrap:wrap;gap:10px}
  .stat{flex:1 1 120px;background:#f8f9fa;border-radius:8px;padding:12px 14px}
  .stat .n{font-size:1.5rem;font-weight:700;line-height:1.2}
  .stat .l{font-size:.75rem;color:#5f6368}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:.75rem;color:#5f6368}
  input,select{font:inherit;padding:9px 10px;border:1px solid #dadce0;border-radius:6px;background:#fff}
  button{font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:6px;
         background:#1a73e8;color:#fff;cursor:pointer}
  button:hover{background:#1765cc}
  button:disabled{background:#c5c9ce;cursor:default}
  button.sec{background:#fff;color:#1a73e8;border:1px solid #dadce0}
  button.sec:hover{background:#f1f3f4}
  .out{margin-top:14px;padding:12px;border-radius:6px;white-space:pre-wrap;
       font-size:.85rem;display:none}
  .out.ok{background:#e6f4ea;color:#137333;display:block}
  .out.ng{background:#fce8e6;color:#c5221f;display:block}
  .out.busy{background:#e8f0fe;color:#1a73e8;display:block}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  th,td{border-bottom:1px solid #e8eaed;padding:7px 8px;text-align:left;white-space:nowrap}
  th{color:#5f6368;font-weight:600;background:#f8f9fa}
  .scroll{overflow-x:auto}
  .links a{color:#1a73e8;margin-right:18px;font-size:.85rem}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;
          flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .btn2{display:inline-block;background:#fff;color:#1a73e8;border:1px solid #dadce0;
        padding:9px 18px;border-radius:6px;text-decoration:none;font-weight:600;font-size:.9rem}
  .btn2:hover{background:#f1f3f4}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.72rem}
  .tag.ok{background:#e6f4ea;color:#137333}
  .tag.ng{background:#fce8e6;color:#c5221f}
  .tag.bad{background:#fce8e6;color:#c5221f}
  .tag.warn{background:#fef7e0;color:#b06000}
  .tag.info{background:#e8f0fe;color:#1a73e8}
  td.detail{white-space:normal;color:#5f6368}
  /* --- グラフ --- */
  .vizscope{--surface-1:#fff;--grid:#e8eaed;--ink-2:#5f6368;--ink-3:#80868b;
       --line:#2a78d6;--c0:#f0efec;--c1:#b7d3f6;--c2:#5598e7;--c3:#1c5cab}
  .viz{position:relative}
  .viz svg{display:block;width:100%;height:auto;overflow:visible}
  /* カバレッジは引き伸ばさない（文字まで拡大されるため）。狭い画面では横スクロール。 */
  .viz.fixed{overflow-x:auto}
  .viz.fixed svg{width:auto;max-width:none}
  .viz .ax{font-size:10px;fill:var(--ink-3)}
  .viz .gl{stroke:var(--grid);stroke-width:1}
  .viz .ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .viz .dot{fill:var(--line);stroke:var(--surface-1);stroke-width:2}
  .viz .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
  .chartHead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px}
  .chartHead .t{font-size:.82rem;font-weight:600;color:#3c4043}
  .chartHead .v{font-size:.78rem;color:#5f6368}
  .tip{position:absolute;pointer-events:none;background:#202124;color:#fff;font-size:.74rem;
       padding:5px 8px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:#5f6368;margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
            vertical-align:-1px}
  .viznote{font-size:.76rem;color:#5f6368;margin:6px 0 0}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .vizscope{--surface-1:#1a1a19;--grid:#383835;--ink-2:#c3c2b7;
      --ink-3:#8f8e87;--line:#3987e5;--c0:#2a2a28;--c1:#184f95;--c2:#2a78d6;--c3:#86b6ef}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1 id="title">読み込み中…</h1>
      <p class="sub" id="whoami">読み込み中…</p>
    </div>
    <a class="btn2" href="?setup=1">初期設定へ</a>
  </div>

  <div class="card">
    <h2>状況</h2>
    <div class="stats" id="stats"></div>
    <p class="links" style="margin:14px 0 0" id="links"></p>
  </div>

  <div class="card vizscope">
    <h2>推移</h2>
    <div class="row" style="margin-bottom:16px">
      <div class="f"><label>被験者</label>
        <select id="vhid"><option value="">全員（中央値）</option></select>
      </div>
      <div class="f"><label>期間</label>
        <select id="vdays">
          <option value="14">14日</option>
          <option value="30" selected>30日</option>
          <option value="60">60日</option>
          <option value="90">90日</option>
        </select>
      </div>
      <button class="sec" id="btnViz">読み込む</button>
    </div>

    <div id="covBox" style="display:none">
      <div class="chartHead"><span class="t">収集カバレッジ</span>
        <span class="v" id="covMeta"></span></div>
      <div class="viz fixed" id="cov"></div>
      <div class="legend">
        <span><i style="background:var(--c0)"></i>記録なし</span>
        <span><i style="background:var(--c1)"></i>1種</span>
        <span><i style="background:var(--c2)"></i>2種</span>
        <span><i style="background:var(--c3)"></i>3種そろい</span>
      </div>
      <p class="viznote">歩数・安静時心拍・睡眠のうち何種類がその日に入ったか。
        直近7日の記録が少ない被験者を上に並べています。</p>
    </div>

    <div id="lineBox"></div>
  </div>

  <div class="card">
    <h2>データを取り直す</h2>
    <div class="row">
      <div class="f"><label>開始日</label><input type="date" id="from"></div>
      <div class="f"><label>終了日</label><input type="date" id="to"></div>
      <div class="f"><label>被験者</label>
        <select id="hid"><option value="">全員</option></select>
      </div>
      <button id="go">実行</button>
    </div>
    <div class="out" id="fetchOut"></div>
    <p class="sub" style="margin:10px 0 0">
      同じ日を取り直しても行は増えません（上書きされます）。
      期間が長いと途中で止まることがあります。その場合はもう一度実行すると続きから進みます。
    </p>
  </div>

  <div class="card">
    <h2>状態の診断</h2>
    <p class="sub" style="margin:-8px 0 12px">
      直近3日のデータと端末の同期状況から、欠測の理由を切り分けます。
      追加の通信はしません。</p>
    <button class="sec" id="btnDiag">読み込む</button>
    <div class="scroll" id="diagOut" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>最近のデータ</h2>
    <button class="sec" id="btnData">読み込む</button>
    <div class="scroll" id="dataOut" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>取得ログ</h2>
    <button class="sec" id="btnLog">読み込む</button>
    <div class="scroll" id="logOut" style="margin-top:12px"></div>
  </div>

</div>

<script>
function $(id) { return document.getElementById(id); }
function show(el, cls, txt) { el.className = 'out ' + cls; el.textContent = txt; }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function stat(n, l) {
  return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
}
function iso(d) { return d.toISOString().substring(0, 10); }

// 初期値：先週1週間
var now = new Date();
$('to').value   = iso(new Date(now.getTime() - 864e5));
$('from').value = iso(new Date(now.getTime() - 7 * 864e5));

// 概況
google.script.run
  .withSuccessHandler(function (s) {
    $('title').textContent = s.studyName + ' 管理';
    document.title = s.studyName + ' 管理';
    $('whoami').textContent = 'データ最終更新 ' + s.lastUpdate + ' ／ 記録 ' + s.dataRows + ' 行';
    $('stats').innerHTML =
      stat(s.authorized, '連携済み') + stat(s.issued, '未連携') +
      stat(s.withdrawn, '撤回') + stat(s.total, '被験者 合計');
    $('links').innerHTML =
      '<a href="' + s.dataUrl  + '" target="_blank">データのシート</a>' +
      '<a href="' + s.opsUrl   + '" target="_blank">運用のシート</a>' +
      '<a href="' + s.driveUrl + '" target="_blank">ドライブ</a>';
    [$('hid'), $('vhid')].forEach(function (sel) {
      s.subjects.forEach(function (id) {
        var o = document.createElement('option');
        o.value = id; o.textContent = id;
        sel.appendChild(o);
      });
    });
    $('btnViz').click();
  })
  .withFailureHandler(function (e) {
    $('whoami').textContent = '読み込みに失敗しました: ' + e.message;
  })
  .adminSummary();

// ---- グラフ ---------------------------------------------------------------
// 外部ライブラリを使わず SVG を直接組む。CDN が塞がれている環境でも動くこと、
// 読み込み待ちでグラフだけ遅れて出る状態を作らないことを優先した。

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(n, a) {
  var e = document.createElementNS(SVGNS, n);
  for (var k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
  return e;
}
function mdLabel(iso) { return iso.substring(5).replace('-', '/'); }
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return v >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v * 10) / 10);
}

function tipFor(box) {
  var t = document.createElement('div');
  t.className = 'tip';
  box.appendChild(t);
  return {
    show: function (x, y, html) {
      t.innerHTML = html; t.style.opacity = 1;
      var w = t.offsetWidth, bw = box.clientWidth;
      t.style.left = Math.max(0, Math.min(bw - w, x - w / 2)) + 'px';
      t.style.top  = Math.max(0, y - t.offsetHeight - 8) + 'px';
    },
    hide: function () { t.style.opacity = 0; }
  };
}

/** 収集カバレッジ（被験者 × 日）。 */
function drawCoverage(box, d) {
  box.innerHTML = '';
  if (!d.ids.length) { box.innerHTML = '<p class="sub">連携済みの被験者がいません。</p>'; return; }

  var LW = 118, GAP = 2, TOP = 16;
  // 日数が少ないときはマスを大きくして、下の折れ線と横幅を揃える
  var CELL = Math.max(10, Math.min(22, Math.round((740 - LW) / d.axis.length)));
  var W = LW + d.axis.length * CELL, H = TOP + d.ids.length * CELL + 4;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
                           'aria-label': '被験者ごと・日ごとの収集状況' });
  var tip = tipFor(box);

  // 日付の目盛り（週の頭だけ）
  d.axis.forEach(function (iso, j) {
    if (new Date(iso + 'T00:00:00').getDay() !== 1) return;
    var t = svgEl('text', { x: LW + j * CELL, y: 10, class: 'ax' });
    t.textContent = mdLabel(iso);
    svg.appendChild(t);
  });

  d.ids.forEach(function (id, i) {
    var y = TOP + i * CELL;
    var lab = svgEl('text', { x: 0, y: y + CELL - GAP - 2, class: 'ax' });
    lab.textContent = id.length > 18 ? '…' + id.slice(-17) : id;
    svg.appendChild(lab);

    d.grid[i].forEach(function (n, j) {
      var r = svgEl('rect', {
        x: LW + j * CELL, y: y, width: CELL - GAP, height: CELL - GAP, rx: 2,
        fill: 'var(--c' + n + ')'
      });
      r.addEventListener('mouseenter', function () {
        var p = r.getBoundingClientRect(), b = box.getBoundingClientRect();
        tip.show(p.left - b.left + p.width / 2, p.top - b.top,
                 id + '<br>' + d.axis[j] + ' ・ ' + n + '/3 種');
      });
      r.addEventListener('mouseleave', tip.hide);
      svg.appendChild(r);
    });
  });
  box.appendChild(svg);
}

/** 1指標の折れ線。欠測はつながず切る（補間すると欠測が見えなくなるため）。 */
function drawLine(host, sr, axis) {
  var card = document.createElement('div');
  card.style.marginTop = '20px';
  var head = document.createElement('div');
  head.className = 'chartHead';
  var last = null;
  for (var k = sr.values.length - 1; k >= 0; k--) if (sr.values[k] !== null) { last = sr.values[k]; break; }
  head.innerHTML = '<span class="t">' + sr.label + '</span>' +
                   '<span class="v">直近 ' + fmtNum(last) + ' ' + sr.unit + '</span>';
  card.appendChild(head);

  var box = document.createElement('div');
  box.className = 'viz';
  card.appendChild(box);
  host.appendChild(card);

  var W = 720, H = 150, L = 44, R = 6, T = 10, B = 20;
  var iw = W - L - R, ih = H - T - B;
  var vals = sr.values.filter(function (v) { return v !== null; });
  if (!vals.length) { box.innerHTML = '<p class="sub">この期間のデータがありません。</p>'; return; }

  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  var pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  if (sr.key === 'steps' && mn < 0) mn = 0;

  var X = function (i) { return L + (axis.length === 1 ? iw / 2 : i * iw / (axis.length - 1)); };
  var Y = function (v) { return T + ih - (v - mn) / (mx - mn) * ih; };

  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                           'aria-label': sr.label + 'の推移' });
  var tip = tipFor(box);

  [0, 0.5, 1].forEach(function (f) {
    var v = mn + (mx - mn) * f, y = Y(v);
    svg.appendChild(svgEl('line', { x1: L, y1: y, x2: W - R, y2: y, class: 'gl' }));
    var t = svgEl('text', { x: L - 6, y: y + 3, class: 'ax', 'text-anchor': 'end' });
    t.textContent = fmtNum(v);
    svg.appendChild(t);
  });

  var step = Math.max(1, Math.ceil(axis.length / 7));
  axis.forEach(function (iso, i) {
    if (i % step) return;
    var t = svgEl('text', { x: X(i), y: H - 4, class: 'ax', 'text-anchor': 'middle' });
    t.textContent = mdLabel(iso);
    svg.appendChild(t);
  });

  var dstr = '', pen = false;
  sr.values.forEach(function (v, i) {
    if (v === null) { pen = false; return; }
    dstr += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true;
  });
  svg.appendChild(svgEl('path', { d: dstr, class: 'ln' }));

  // 前後が欠測の孤立点は線にならないので点を打つ
  sr.values.forEach(function (v, i) {
    if (v === null) return;
    var pre = i > 0 && sr.values[i - 1] !== null, nx = i < sr.values.length - 1 && sr.values[i + 1] !== null;
    if (!pre && !nx) svg.appendChild(svgEl('circle', { cx: X(i), cy: Y(v), r: 3, class: 'dot' }));
  });

  var cross = svgEl('line', { y1: T, y2: T + ih, class: 'cross', opacity: 0 });
  var hd = svgEl('circle', { r: 4.5, class: 'dot', opacity: 0 });
  svg.appendChild(cross); svg.appendChild(hd);

  var hit = svgEl('rect', { x: L, y: T, width: iw, height: ih, fill: 'transparent' });
  hit.addEventListener('mousemove', function (ev) {
    var b = svg.getBoundingClientRect();
    var rel = (ev.clientX - b.left) / b.width * W;
    var i = Math.round((rel - L) / (iw || 1) * (axis.length - 1));
    i = Math.max(0, Math.min(axis.length - 1, i));
    var v = sr.values[i], px = X(i) / W * b.width, bb = box.getBoundingClientRect();
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
    if (v === null) { hd.setAttribute('opacity', 0); }
    else { hd.setAttribute('cx', X(i)); hd.setAttribute('cy', Y(v)); hd.setAttribute('opacity', 1); }
    tip.show(px, (b.top - bb.top) + (v === null ? T : Y(v)) / H * b.height,
             axis[i] + '<br>' + (v === null ? '記録なし' : fmtNum(v) + ' ' + sr.unit));
  });
  hit.addEventListener('mouseleave', function () {
    cross.setAttribute('opacity', 0); hd.setAttribute('opacity', 0); tip.hide();
  });
  svg.appendChild(hit);
  box.appendChild(svg);
}

$('btnViz').onclick = function () {
  var b = $('btnViz'), days = $('vdays').value, hid = $('vhid').value;
  b.disabled = true; b.textContent = '読み込み中…';
  var done = 0;
  function fin() { if (++done === 2) { b.disabled = false; b.textContent = '再読み込み'; } }

  google.script.run
    .withSuccessHandler(function (d) {
      $('covBox').style.display = 'block';
      $('covMeta').textContent = d.ids.length + ' 名 ・ ' + d.axis.length + ' 日';
      drawCoverage($('cov'), d); fin();
    })
    .withFailureHandler(function (e) { $('cov').textContent = e.message; fin(); })
    .adminCoverage(days);

  google.script.run
    .withSuccessHandler(function (d) {
      var host = $('lineBox'); host.innerHTML = '';
      d.series.forEach(function (sr) { drawLine(host, sr, d.axis); });
      fin();
    })
    .withFailureHandler(function (e) { $('lineBox').textContent = e.message; fin(); })
    .adminSeries(hid, days);
};

// 取り直す
$('go').onclick = function () {
  var b = $('go');
  b.disabled = true;
  show($('fetchOut'), 'busy', '実行中…（長い期間だと数分かかります）');
  google.script.run
    .withSuccessHandler(function (m) { b.disabled = false; show($('fetchOut'), 'ok', m); })
    .withFailureHandler(function (e) { b.disabled = false; show($('fetchOut'), 'ng', e.message); })
    .adminFetch($('from').value, $('to').value, $('hid').value);
};

// 状態の診断
$('btnDiag').onclick = function () {
  var b = $('btnDiag');
  b.disabled = true; b.textContent = '読み込み中…';
  google.script.run
    .withSuccessHandler(function (rows) {
      b.disabled = false; b.textContent = '再読み込み';
      if (!rows.length) { $('diagOut').textContent = '連携済みの被験者がいません。'; return; }
      var ng = rows.filter(function (r) { return r.level !== 'ok'; }).length;
      var h = '<p class="sub">' + (ng ? ng + ' 名に対応が要るかもしれません' : '全員正常です') + '</p>';
      h += '<table><tr><th>被験者</th><th>状態</th><th>内容</th>' +
           '<th>最終同期</th><th>電池</th><th>直近3日（歩/心/睡）</th></tr>';
      rows.forEach(function (r) {
        h += '<tr><td>' + esc(r.humanome_id) + '</td>' +
             '<td><span class="tag ' + r.level + '">' + esc(r.label) + '</span></td>' +
             '<td class="detail">' + esc(r.detail) + '</td>' +
             '<td>' + esc(r.lastSync) + (r.syncAge !== '' ? '（' + r.syncAge + '日前）' : '') + '</td>' +
             '<td>' + (r.battery !== '' ? esc(r.battery) + '%' : '') + '</td>' +
             '<td>' + r.days.steps + ' / ' + r.days.hr + ' / ' + r.days.sleep + '</td></tr>';
      });
      $('diagOut').innerHTML = h + '</table>';
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = '再読み込み';
      $('diagOut').textContent = e.message;
    })
    .adminDiagnose();
};

// 最近のデータ
$('btnData').onclick = function () {
  var b = $('btnData');
  b.disabled = true; b.textContent = '読み込み中…';
  google.script.run
    .withSuccessHandler(function (d) {
      b.disabled = false; b.textContent = '再読み込み';
      var h = '<table><tr>' + d.cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
      d.rows.forEach(function (r) {
        h += '<tr>' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>';
      });
      $('dataOut').innerHTML = h + '</table>';
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = '再読み込み';
      $('dataOut').textContent = e.message;
    })
    .adminRecent(15);
};

// 取得ログ
$('btnLog').onclick = function () {
  var b = $('btnLog');
  b.disabled = true; b.textContent = '読み込み中…';
  google.script.run
    .withSuccessHandler(function (rows) {
      b.disabled = false; b.textContent = '再読み込み';
      var h = '<table><tr><th>時刻</th><th>データ型</th><th>期間</th>' +
              '<th>結果</th><th>件数</th><th>エラー</th></tr>';
      rows.forEach(function (r) {
        var tag = r.status === 'ok'
          ? '<span class="tag ok">ok</span>'
          : '<span class="tag ng">' + esc(r.code) + '</span>';
        h += '<tr><td>' + esc(r.at) + '</td><td>' + esc(r.type) + '</td><td>' + esc(r.range) +
             '</td><td>' + tag + '</td><td>' + esc(r.n) + '</td><td>' + esc(r.error) + '</td></tr>';
      });
      $('logOut').innerHTML = h + '</table>';
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = '再読み込み';
      $('logOut').textContent = e.message;
    })
    .adminLog(30);
};
</script>
</body>
</html>
